name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: >-
          python -m py_compile
          .agents/skills/antigravity-intercom/runtime_adapter.py
          .agents/skills/antigravity-intercom/nostr_relay.py
          .agents/skills/antigravity-intercom/nostr_listener.py
          .agents/skills/antigravity-intercom/server.py
